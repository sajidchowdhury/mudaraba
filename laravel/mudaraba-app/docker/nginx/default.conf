# =============================================================================
# Nginx config for Mudaraba Laravel app
# Serves /public directly, passes PHP to php-fpm:9000
# =============================================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    #charset koi8-r;
    charset utf-8;

    # Upload size limit
    client_max_body_size 64M;

    # Access log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Main location — Laravel routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # Static assets (built by Vite) — serve directly with long cache
    # --------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Vite HMR (dev only — when public/hot exists)
    # --------------------------------------------------------------------------
    location /hot {
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Storage (symlinked public/storage)
    # --------------------------------------------------------------------------
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --------------------------------------------------------------------------
    # PHP handler
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Buffers
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_read_timeout 120s;

        # Important for Inertia/React
        fastcgi_param HTTPS $https if_not_empty;
    }

    # --------------------------------------------------------------------------
    # Deny hidden files (.env, .git, etc.)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --------------------------------------------------------------------------
    # Favicon
    # --------------------------------------------------------------------------
    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }
}

; =============================================================================
; Mudaraba PHP overrides (Docker dev)
; =============================================================================

; Memory + execution
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; Upload
upload_max_filesize = 64M
post_max_size = 72M

; Timezone — the M/Y operates in Asia/Dhaka (matches PHP project)
date.timezone = Asia/Dhaka

; Error reporting (dev)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; OPcache — improves FPM throughput
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; Realpath cache (improves file stat performance)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Session
session.gc_maxlifetime = 7200

; Expose PHP — disabled for security
expose_php = Off

; Xdebug (uncomment to enable for debugging)
; [Xdebug]
; zend_extension = xdebug
; xdebug.mode = debug
; xdebug.start_with_request = trigger
; xdebug.client_host = host.docker.internal
; xdebug.client_port = 9003
; xdebug.log = /tmp/xdebug.log
